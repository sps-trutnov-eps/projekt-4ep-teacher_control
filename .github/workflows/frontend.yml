name: frontend

on:
  push:
    branches:
      - main
      - staging
      - feat/*

  pull_request:
    paths:
      - 'src/TeacherControl.web/**'
      - '.github/workflows/frontend.yml'

jobs:
  build:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: src/TeacherControl.web

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/TeacherControl.web/.nvmrc
          cache: pnpm
          cache-dependency-path: src/TeacherControl.web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm build

  format:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: src/TeacherControl.web

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/TeacherControl.web/.nvmrc
          cache: pnpm
          cache-dependency-path: src/TeacherControl.web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run format check
        id: format
        run: pnpm lint
